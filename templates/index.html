<!-- Replace your entire <form> block with this -->
<input type="file" id="fileInput" accept="image/*">
<button onclick="analyzeImage()">Analyze Image</button>

<script>
const BACKEND = "https://your-app.onrender.com"; // paste your Render URL here

async function analyzeImage() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Please select an image");

  const formData = new FormData();
  formData.append("file", file);

  document.querySelector(".result").innerHTML = "Analyzing...";

  const res = await fetch(`${BACKEND}/predict`, { method: "POST", body: formData });
  const data = await res.json();

  if (data.error) {
    document.querySelector(".error").innerHTML = data.error;
  } else {
    document.querySelector(".result").innerHTML = `Prediction: <b>${data.prediction}</b>`;
    document.querySelector(".confidence").innerHTML = `Confidence: ${data.confidence}%`;
  }
}
</script>
